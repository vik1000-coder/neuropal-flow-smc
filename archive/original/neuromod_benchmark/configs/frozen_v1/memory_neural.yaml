schema_version: "1"
name: frozen_v1_memory_neural
output_dir: outputs/frozen_v1/memory_neural
seeds: [3, 4, 5]
views: [latent, calcium]
max_lags: [1, 2, 4, 8, 16]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 32
resource:
  max_threads: 1
  max_parallel_jobs: 1
  max_rss_gb: 6.0
  max_output_gb: 0.8
  nice: 19
  checkpoint_minutes: 15
  stop_free_disk_gb: 4.0
scenarios:
  - id: "null"
    family: mechanistic
    n_trajectories: 10
    params: &memory_neural_base
      n_neurons: 8
      n_modulators: 2
      n_steps: 800
      burn_in: 1200
      mechanism: "null"
      effect_strength: 0.45
      ligand_pulse_rate_hz: 0.08
      ligand_pulse_amplitude: 2.5
      tail_threshold: 0.35
      shape_tail_z: 2.0
  - id: mixed
    family: mechanistic
    n_trajectories: 10
    params: {<<: *memory_neural_base, mechanism: mixed, effect_strength: 0.8}
methods:
  - name: gaussian_mlp_nll
    params: {hidden: 56, layers: 2, max_epochs: 50, patience: 8, batch_size: 256, dropout: 0.1, weight_decay: 0.0001, tail_threshold: 0.35}
  - name: gaussian_mlp_dsm_s025
    params: {hidden: 56, layers: 2, max_epochs: 50, patience: 8, batch_size: 256, dsm_sigma: 0.25, weight_decay: 0.0001, tail_threshold: 0.35}
  - name: gaussian_mlp_dsm_s050
    params: {hidden: 56, layers: 2, max_epochs: 50, patience: 8, batch_size: 256, weight_decay: 0.0001, tail_threshold: 0.35}
  - name: mdn_k3
    params: {hidden: 56, layers: 2, max_epochs: 50, patience: 8, batch_size: 256, weight_decay: 0.0001, tail_threshold: 0.35, shape_tail_z: 2.0}
  - name: mdn_k7
    params: {hidden: 56, layers: 2, max_epochs: 50, patience: 8, batch_size: 256, weight_decay: 0.0001, tail_threshold: 0.35, shape_tail_z: 2.0}
  - name: score_mlp_gaussian_s025
    params: {hidden: 56, layers: 2, max_epochs: 45, patience: 7, batch_size: 256, weight_decay: 0.0001}
  - name: score_mlp_gaussian_s050
    params: {hidden: 56, layers: 2, max_epochs: 45, patience: 7, batch_size: 256, weight_decay: 0.0001}
  - name: score_mlp_student_s025
    params: {hidden: 56, layers: 2, max_epochs: 45, patience: 7, batch_size: 256, weight_decay: 0.0001}
  - name: score_mlp_student_s050
    params: {hidden: 56, layers: 2, max_epochs: 45, patience: 7, batch_size: 256, weight_decay: 0.0001}
  - name: sbtg_linear_s025
    params: {hidden: 44, layers: 2, max_epochs: 48, patience: 7, batch_size: 256, weight_decay: 0.0001, coupling_l1: 0.001}
  - name: sbtg_feature_bilinear_s025
    params: {hidden: 44, layers: 2, feature_dim: 10, max_epochs: 48, patience: 7, batch_size: 256, weight_decay: 0.0001}
  - name: sbtg_feature_bilinear_s050
    params: {hidden: 44, layers: 2, feature_dim: 10, max_epochs: 48, patience: 7, batch_size: 256, weight_decay: 0.0001}
  - name: sbtg_feature_student_s025
    params: {hidden: 44, layers: 2, feature_dim: 10, max_epochs: 48, patience: 7, batch_size: 256, weight_decay: 0.0001}
  - name: sbtg_feature_student_s050
    params: {hidden: 44, layers: 2, feature_dim: 10, max_epochs: 48, patience: 7, batch_size: 256, weight_decay: 0.0001}
