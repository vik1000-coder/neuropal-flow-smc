schema_version: "1"
name: frozen_v1_bridge_path
output_dir: outputs/frozen_v1/bridge_path
history_lags: [1]
horizons: [8, 32, 128]
views: [complete_state]
seeds: [3, 4, 5, 6, 7]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 32
resource:
  max_threads: 1
  max_parallel_jobs: 1
  max_rss_gb: 6.0
  max_output_gb: 0.8
  nice: 19
  checkpoint_minutes: 15
  stop_free_disk_gb: 4.0
scenarios:
  - id: "null"
    family: mechanistic
    n_trajectories: 10
    params: &bridge_base
      n_neurons: 8
      n_modulators: 2
      n_steps: 1000
      burn_in: 1200
      mechanism: "null"
      effect_strength: 0.45
      ligand_pulse_rate_hz: 0.08
      ligand_pulse_amplitude: 2.5
      tail_threshold: 0.35
      shape_tail_z: 2.0
  - id: mixed
    family: mechanistic
    n_trajectories: 10
    params: {<<: *bridge_base, mechanism: mixed, effect_strength: 0.8}
methods:
  - name: conditional_schrodinger_bridge_d015
    params: {mean_ridge: 1.0, variance_ridge: 10.0}
  - name: conditional_schrodinger_bridge_d030
    params: {mean_ridge: 1.0, variance_ridge: 10.0}
  - name: conditional_schrodinger_bridge_d060
    params: {mean_ridge: 1.0, variance_ridge: 10.0}
