schema_version: "1"
name: frozen_v1_robustness_light
output_dir: outputs/frozen_v1/robustness_light
seeds: [3, 4, 5, 6, 7]
coefficient_cvs: [0.0, 0.15, 0.35]
views: [calcium]
history_lags: [1]
horizon: 1
n_predictive_samples: 32
hierarchy_counts: {train: 6, validation: 2, test: 3}
resource:
  max_threads: 2
  max_parallel_jobs: 1
  max_rss_gb: 6.0
  max_output_gb: 0.8
  nice: 19
  checkpoint_minutes: 15
  stop_free_disk_gb: 4.0
observation_variants:
  - {name: reference}
  - {name: high_measurement_noise, measurement_noise_multiplier: 2.5}
  - {name: slow_calcium, calcium_decay_multiplier: 2.0}
scenarios:
  - id: "null"
    params: &robustness_base
      n_neurons: 8
      n_modulators: 2
      n_steps: 650
      burn_in: 950
      mechanism: "null"
      effect_strength: 0.45
      ligand_pulse_rate_hz: 0.08
      ligand_pulse_amplitude: 2.5
      tail_threshold: 0.35
      shape_tail_z: 2.0
  - id: mixed
    params: {<<: *robustness_base, mechanism: mixed, effect_strength: 0.8}
methods:
  - name: ridge_var
    params: {ridge: 10.0}
  - name: heteroskedastic_ridge
    params: {mean_ridge: 1.0, variance_ridge: 100.0}
  - name: student_t_ridge
    params: {mean_ridge: 1.0, variance_ridge: 10.0, df: 10.0}
  - name: gaussian_nll
    params: {maxiter: 260, ridge: 0.1}
  - name: sid_dsm_s075
    params: {ridge: 0.01, n_corruptions: 4, tail_threshold: 0.35}
  - name: sid_dsm_s100
    params: {ridge: 0.01, n_corruptions: 4, tail_threshold: 0.35}
  - name: pysindy_discrete_official
    params: {max_iter: 10, degree: 1, threshold: 0.05, alpha: 0.001}
  - name: pcmci_parcorr
    params: {tau_max: 1, pc_alpha: 0.2, alpha_level: 0.05, fdr_method: fdr_bh}
  - name: var_lingam_official
    params: {lags: 1, prune: false}
