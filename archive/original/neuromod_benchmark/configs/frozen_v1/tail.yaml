schema_version: "1"
name: frozen_v1_tail
output_dir: outputs/frozen_v1/tail
history_lags: [1]
horizons: [1]
views: [complete_state, calcium]
seeds: [3, 4, 5, 6, 7]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 128
resource:
  max_threads: 2
  max_parallel_jobs: 1
  max_rss_gb: 6.0
  max_output_gb: 0.9
  nice: 19
  checkpoint_minutes: 15
  stop_free_disk_gb: 4.0
scenarios:
  - id: "null"
    family: mechanistic
    n_trajectories: 10
    params: &tail_base
      n_neurons: 8
      n_modulators: 2
      n_steps: 900
      burn_in: 1200
      mechanism: "null"
      effect_strength: 0.45
      tail_low_scale: 0.5
      tail_high_scale: 3.0
      ligand_pulse_rate_hz: 0.08
      ligand_pulse_amplitude: 2.5
      tail_threshold: 0.35
      shape_tail_z: 2.0
  - id: matched_tail
    family: mechanistic
    n_trajectories: 10
    params: {<<: *tail_base, mechanism: matched_tail, effect_strength: 2.5}
  - id: mixed
    family: mechanistic
    n_trajectories: 10
    params: {<<: *tail_base, mechanism: mixed, effect_strength: 0.8}
methods:
  - {name: constant_gaussian}
  - name: ridge_var
    tune: {ridge: [0.1, 1.0, 10.0]}
  - name: heteroskedastic_ridge
    tune: {mean_ridge: [0.1, 1.0], variance_ridge: [10.0, 100.0]}
  - name: student_t_ridge
    params: {mean_ridge: 1.0, variance_ridge: 10.0}
    tune: {df: [3.5, 10.0]}
  - name: gaussian_nll
    params: {maxiter: 300, ridge: 0.1}
  - name: sid_hyvarinen
    params: {ridge: 0.01, tail_threshold: 0.35}
  - name: sid_dsm_s075
    params: {ridge: 0.01, n_corruptions: 4, tail_threshold: 0.35}
  - name: sid_dsm_s100
    params: {ridge: 0.01, n_corruptions: 4, tail_threshold: 0.35}
  - name: gaussian_mlp_nll
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 65, patience: 10, batch_size: 256, tail_threshold: 0.35}
    tune: {dropout: [0.0, 0.1], weight_decay: [0.0001, 0.01]}
  - name: gaussian_mlp_dsm_s025
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 65, patience: 10, batch_size: 256, tail_threshold: 0.35}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: gaussian_mlp_dsm_s050
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 65, patience: 10, batch_size: 256, tail_threshold: 0.35}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: mdn_k3
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 65, patience: 10, batch_size: 256, tail_threshold: 0.35, shape_tail_z: 2.0}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: mdn_k7
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 65, patience: 10, batch_size: 256, tail_threshold: 0.35, shape_tail_z: 2.0}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: score_mlp_gaussian_s025
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 55, patience: 9, batch_size: 256}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: score_mlp_gaussian_s050
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 55, patience: 9, batch_size: 256}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: score_mlp_student_s025
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 55, patience: 9, batch_size: 256}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: score_mlp_student_s050
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 55, patience: 9, batch_size: 256}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: sbtg_linear_s025
    seeds: [3, 4, 5]
    params: {hidden: 48, layers: 2, max_epochs: 60, patience: 9, batch_size: 256, weight_decay: 0.0001, coupling_l1: 0.001}
  - name: sbtg_feature_bilinear_s025
    seeds: [3, 4, 5]
    params: {hidden: 48, layers: 2, feature_dim: 12, max_epochs: 60, patience: 9, batch_size: 256}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: sbtg_feature_bilinear_s050
    seeds: [3, 4, 5]
    params: {hidden: 48, layers: 2, feature_dim: 12, max_epochs: 60, patience: 9, batch_size: 256}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: sbtg_feature_student_s025
    seeds: [3, 4, 5]
    params: {hidden: 48, layers: 2, feature_dim: 12, max_epochs: 60, patience: 9, batch_size: 256}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: sbtg_feature_student_s050
    seeds: [3, 4, 5]
    params: {hidden: 48, layers: 2, feature_dim: 12, max_epochs: 60, patience: 9, batch_size: 256}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: latent_neuromodulated_ssm
    views: [calcium]
    seeds: [3, 4, 5]
    params: {n_modulators: 2, max_epochs: 80, patience: 12, truncation: 112, warmup: 10, effect_l1: 0.01, weight_decay: 0.0001, tail_threshold: 0.35, shape_tail_z: 2.0}
  - name: latent_neuromodulated_mixture_ssm
    views: [calcium]
    seeds: [3, 4, 5]
    params: {n_modulators: 2, max_epochs: 80, patience: 12, truncation: 112, warmup: 10, effect_l1: 0.01, weight_decay: 0.0001, tail_low_scale: 0.5, tail_high_scale: 3.0, tail_threshold: 0.35, shape_tail_z: 2.0}
