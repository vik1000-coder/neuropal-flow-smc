schema_version: "1"
name: frozen_v1_causal_stress
output_dir: outputs/frozen_v1/causal_stress
history_lags: [1]
horizons: [1]
views: [complete_state]
seeds: [3, 4, 5, 6, 7]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 8
resource:
  max_threads: 2
  max_parallel_jobs: 1
  max_rss_gb: 6.0
  max_output_gb: 0.5
  nice: 19
  checkpoint_minutes: 15
  stop_free_disk_gb: 4.0
scenarios:
  - id: causally_sufficient
    family: legacy_generalized
    n_trajectories: 10
    params: &causal_base
      n_neurons: 10
      n_modulators: 2
      n_steps: 1200
      burn_in: 300
      mechanism: "null"
      hidden_driver_strength: 0.0
      include_counterfactual: false
      store_pointwise_jacobians: true
  - id: moderate_hidden_common_driver
    family: legacy_generalized
    n_trajectories: 10
    params: {<<: *causal_base, hidden_driver_strength: 0.3}
  - id: strong_hidden_common_driver
    family: legacy_generalized
    n_trajectories: 10
    params: {<<: *causal_base, hidden_driver_strength: 0.6}
methods:
  - {name: lagged_correlation}
  - name: ridge_var
    tune: {ridge: [0.1, 1.0, 10.0]}
  - name: conditional_granger_ridge
    params: {ridge: 1.0}
  - name: lagged_sparse_transition
    params: {alpha: 0.01}
  - name: sindy_discrete
    params: {max_iter: 10, ridge: 0.001, degree: 1, threshold: 0.02}
  - name: pysindy_discrete_official
    params: {max_iter: 10, degree: 1, threshold: 0.05, alpha: 0.001}
  - name: pcmci_parcorr
    params: {tau_max: 1, pc_alpha: 0.2, alpha_level: 0.05, fdr_method: fdr_bh}
  - name: var_lingam_official
    params: {lags: 1, prune: false}
