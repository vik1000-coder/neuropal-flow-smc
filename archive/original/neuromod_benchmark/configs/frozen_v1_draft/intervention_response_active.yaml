schema_version: "1"
name: frozen_v1_intervention_response_active
output_dir: outputs/frozen_v1/intervention_response_active
history_lags: [1]
horizons: [1]
views: [complete_state]
seeds: [3, 4, 5, 6, 7]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 32
resource:
  max_threads: 2
  max_parallel_jobs: 1
  max_rss_gb: 6.0
  max_output_gb: 0.8
  nice: 19
  checkpoint_minutes: 15
  stop_free_disk_gb: 4.0
scenarios:
  - id: additive_mean_high_signal
    family: mechanistic
    n_trajectories: 10
    params: &response_active_base
      n_neurons: 8
      n_modulators: 1
      n_steps: 1000
      burn_in: 1000
      mechanism: additive_mean
      effect_strength: 0.35
      # Zero Bernoulli density invokes the simulator's exactly-one-source guard;
      # first_active is therefore the unique, hence dominant, release source.
      release_density: 0.0
      release_gain: 4.0
      receptor_density: 1.0
      effect_density: 1.0
      clearance_seconds_min: 4.0
      clearance_seconds_max: 40.0
      ligand_pulse_rate_hz: 0.08
      ligand_pulse_amplitude: 2.5
      tail_threshold: 0.35
      shape_tail_z: 2.0
  - id: synaptic_gain_high_signal
    family: mechanistic
    n_trajectories: 10
    params: {<<: *response_active_base, mechanism: synaptic_gain, effect_strength: 3.2, neural_bias_scale: 0.4, base_noise: 0.08}
  - id: intrinsic_excitability_high_signal
    family: mechanistic
    n_trajectories: 10
    params: {<<: *response_active_base, mechanism: intrinsic_excitability, effect_strength: 0.9, base_noise: 0.15}
  - id: mixed_high_signal
    family: mechanistic
    n_trajectories: 10
    params: {<<: *response_active_base, mechanism: mixed, effect_strength: 1.5}
methods:
  - {name: constant_gaussian}
  - name: ridge_var
    tune: {ridge: [0.1, 1.0, 10.0]}
  - name: heteroskedastic_ridge
    tune: {mean_ridge: [0.1, 1.0], variance_ridge: [10.0, 100.0]}
  - name: student_t_ridge
    params: {mean_ridge: 1.0, variance_ridge: 10.0}
    tune: {df: [3.5, 10.0]}
  - name: gaussian_nll
    params: {maxiter: 280, ridge: 0.1}
  - name: gaussian_mlp_nll
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 60, patience: 9, batch_size: 256, tail_threshold: 0.35}
    tune: {dropout: [0.0, 0.1], weight_decay: [0.0001, 0.01]}
  - name: mdn_k3
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 60, patience: 9, batch_size: 256, tail_threshold: 0.35, shape_tail_z: 2.0}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: mdn_k7
    seeds: [3, 4, 5]
    params: {hidden: 64, layers: 2, max_epochs: 60, patience: 9, batch_size: 256, tail_threshold: 0.35, shape_tail_z: 2.0}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: latent_neuromodulated_ssm
    seeds: [3, 4, 5]
    params: {n_modulators: 1, max_epochs: 80, patience: 12, truncation: 112, warmup: 10, effect_l1: 0.0001, weight_decay: 0.0001, tail_threshold: 0.35, shape_tail_z: 2.0}
  - name: latent_neuromodulated_mixture_ssm
    scenarios: [mixed_high_signal]
    seeds: [3, 4, 5]
    params: {n_modulators: 1, max_epochs: 80, patience: 12, truncation: 112, warmup: 10, effect_l1: 0.0001, weight_decay: 0.0001, tail_low_scale: 0.5, tail_high_scale: 3.0, tail_threshold: 0.35, shape_tail_z: 2.0}
response_kernel_evaluation:
  horizon: 320
  n_pairs: 16
  minimum_active_truth_rms_to_innovation_rms: 0.005
  maximum_truth_mc_se_to_truth_rms_ratio: 0.35
  minimum_transient_decay_estimable_fraction: 0.25
  operations:
    - id: ligand_pulse
      kind: ligand_pulse
      modulator_index: 0
      amplitude: 5.0
      duration_steps: 16
      expected_effect: active
    - id: receptor_knockout
      kind: receptor_knockout
      modulator_index: 0
      selection: first_active
      expected_effect: active
    - id: release_source_silencing
      kind: release_source_silencing
      modulator_index: 0
      selection: first_active
      duration_steps: 80
      expected_effect: active
