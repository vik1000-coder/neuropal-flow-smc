schema_version: "1"
name: frozen_v1_latent_recovery
output_dir: outputs/frozen_v1/latent_recovery
history_lags: [1]
horizons: [1]
views: [latent, calcium]
seeds: [3, 4, 5]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 32
resource:
  max_threads: 1
  max_parallel_jobs: 1
  max_rss_gb: 6.0
  max_output_gb: 0.9
  nice: 19
  checkpoint_minutes: 15
  stop_free_disk_gb: 4.0
scenarios:
  - id: "null"
    family: mechanistic
    n_trajectories: 10
    params: &latent_recovery_base
      n_neurons: 8
      n_modulators: 2
      n_steps: 1000
      burn_in: 1200
      mechanism: "null"
      effect_strength: 0.45
      tail_low_scale: 0.5
      tail_high_scale: 3.0
      ligand_pulse_rate_hz: 0.08
      ligand_pulse_amplitude: 2.5
      tail_threshold: 0.35
      shape_tail_z: 2.0
  - id: additive_mean
    family: mechanistic
    n_trajectories: 10
    params: {<<: *latent_recovery_base, mechanism: additive_mean, effect_strength: 0.35}
  - id: matched_tail
    family: mechanistic
    n_trajectories: 10
    params: {<<: *latent_recovery_base, mechanism: matched_tail, effect_strength: 2.5}
  - id: mixed
    family: mechanistic
    n_trajectories: 10
    params: {<<: *latent_recovery_base, mechanism: mixed, effect_strength: 0.8}
methods:
  - {name: ridge_var}
  - name: heteroskedastic_ridge
    params: {mean_ridge: 1.0, variance_ridge: 10.0}
  - name: student_t_ridge
    params: {mean_ridge: 1.0, variance_ridge: 10.0, df: 3.5}
  - name: latent_neuromodulated_ssm
    views: [latent]
    params: {n_modulators: 2, max_epochs: 80, patience: 12, truncation: 112, warmup: 10, effect_l1: 0.0001, weight_decay: 0.0001, tail_threshold: 0.35, shape_tail_z: 2.0}
  - name: latent_neuromodulated_ssm
    views: [calcium]
    params: {n_modulators: 2, max_epochs: 80, patience: 12, truncation: 112, warmup: 10, effect_l1: 0.01, weight_decay: 0.0001, tail_threshold: 0.35, shape_tail_z: 2.0}
  - name: latent_neuromodulated_mixture_ssm
    views: [latent]
    scenarios: [matched_tail, mixed]
    params: {n_modulators: 2, max_epochs: 80, patience: 12, truncation: 112, warmup: 10, effect_l1: 0.0001, weight_decay: 0.0001, tail_low_scale: 0.5, tail_high_scale: 3.0, tail_threshold: 0.35, shape_tail_z: 2.0}
  - name: latent_neuromodulated_mixture_ssm
    views: [calcium]
    scenarios: [matched_tail, mixed]
    params: {n_modulators: 2, max_epochs: 80, patience: 12, truncation: 112, warmup: 10, effect_l1: 0.01, weight_decay: 0.0001, tail_low_scale: 0.5, tail_high_scale: 3.0, tail_threshold: 0.35, shape_tail_z: 2.0}
