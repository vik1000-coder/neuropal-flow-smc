schema_version: "1"
name: developmental_boundary_nonlatent
output_dir: outputs/developmental_boundary_nonlatent
history_lags: [1]
horizons: [1]
views: [complete_state, calcium]
# Developmental seeds only.  These must not enter frozen confidence intervals.
seeds: [0, 1, 2]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 32
resource:
  max_threads: 1
  max_parallel_jobs: 1
  max_rss_gb: 5.0
  max_output_gb: 0.4
  nice: 19
  checkpoint_minutes: 5
  stop_free_disk_gb: 4.0
scenarios:
  - id: matched_tail
    family: mechanistic
    n_trajectories: 8
    params:
      n_neurons: 8
      n_modulators: 2
      n_steps: 600
      burn_in: 900
      mechanism: matched_tail
      effect_strength: 2.5
      ligand_pulse_rate_hz: 0.08
      ligand_pulse_amplitude: 2.5
      tail_threshold: 0.35
      shape_tail_z: 2.0
  - id: mixed
    family: mechanistic
    n_trajectories: 8
    params:
      n_neurons: 8
      n_modulators: 2
      n_steps: 600
      burn_in: 900
      mechanism: mixed
      effect_strength: 0.8
      ligand_pulse_rate_hz: 0.08
      ligand_pulse_amplitude: 2.5
      tail_threshold: 0.35
      shape_tail_z: 2.0
methods:
  - name: sid_dsm
    params:
      n_corruptions: 3
      tail_threshold: 0.35
    tune:
      ridge: [0.01, 0.1]
      sigma_fraction: [0.25, 0.5, 0.75, 1.0]
  - name: gaussian_mlp_dsm
    params:
      hidden: 64
      layers: 2
      max_epochs: 35
      patience: 6
      batch_size: 256
      tail_threshold: 0.35
    tune:
      dsm_sigma: [0.1, 0.25, 0.5]
      weight_decay: [0.0001, 0.01]
  - name: mdn
    params:
      hidden: 64
      layers: 2
      max_epochs: 35
      patience: 6
      batch_size: 256
      tail_threshold: 0.35
      shape_tail_z: 2.0
    tune:
      components: [3, 5, 7]
      weight_decay: [0.0001, 0.01]
  - name: score_mlp_gaussian
    params:
      hidden: 64
      layers: 2
      max_epochs: 30
      patience: 6
      batch_size: 256
    tune:
      noise_scale: [0.1, 0.25, 0.5]
      weight_decay: [0.0001, 0.01]
  - name: sbtg_linear
    params:
      hidden: 48
      layers: 2
      max_epochs: 32
      patience: 6
      batch_size: 256
    tune:
      noise_scale: [0.1, 0.25, 0.5]
      coupling_l1: [0.0, 0.001]
  - name: sbtg_feature_bilinear
    params:
      hidden: 48
      layers: 2
      feature_dim: 12
      max_epochs: 32
      patience: 6
      batch_size: 256
    tune:
      noise_scale: [0.1, 0.25, 0.5]
      weight_decay: [0.0001, 0.01]
