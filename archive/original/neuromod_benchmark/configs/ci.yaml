schema_version: "1"
name: ci
output_dir: outputs/ci
history_lags: [1]
horizons: [1]
views: [complete_state]
seeds: [0]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 2
resource:
  max_threads: 1
  max_parallel_jobs: 1
  max_rss_gb: 4.0
  max_output_gb: 0.1
  nice: 19
  checkpoint_minutes: 5
  stop_free_disk_gb: 4.0
scenarios:
  - id: variance_ci
    family: mechanistic
    n_trajectories: 5
    params:
      n_neurons: 3
      n_modulators: 1
      n_steps: 60
      burn_in: 30
      mechanism: innovation_variance
methods:
  - name: ridge_var
    tune:
      ridge: [0.1, 1.0]
  - name: sid_hyvarinen
    params:
      ridge: 0.1
