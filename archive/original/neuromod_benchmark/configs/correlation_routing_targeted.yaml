schema_version: "1"
name: correlation_routing_targeted
output_dir: outputs/correlation_routing_targeted
history_lags: [1]
horizons: [1]
views: [complete_state, calcium]
seeds: [0, 1, 2]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 128
resource:
  max_threads: 1
  max_parallel_jobs: 1
  max_rss_gb: 4.0
  max_output_gb: 0.25
  nice: 19
  checkpoint_minutes: 10
  stop_free_disk_gb: 4.0
scenarios:
  - id: correlation_routing
    family: mechanistic
    n_trajectories: 7
    params:
      n_neurons: 6
      n_modulators: 2
      n_steps: 420
      burn_in: 600
      mechanism: correlation_routing
      effect_strength: 1.8
      correlation_max_loading: 0.80
      ligand_pulse_rate_hz: 0.08
      ligand_pulse_amplitude: 2.5
methods:
  - name: constant_gaussian
  - name: ridge_var
    tune: {ridge: [0.1, 1.0, 10.0]}
  - name: ridge_full_covariance
    tune: {ridge: [0.1, 1.0], covariance_shrinkage: [0.05, 0.25]}
  - name: conditional_covariance_ridge
    tune:
      mean_ridge: [0.1, 1.0]
      variance_ridge: [5.0, 20.0]
      correlation_ridge: [1.0, 10.0]
      correlation_scale: [0.35, 0.65]
  - name: mdn
    params: {hidden: 48, layers: 2, max_epochs: 35, patience: 7, batch_size: 256}
    tune: {components: [2, 3], weight_decay: [0.0001, 0.01]}
  - name: score_mlp_gaussian
    params: {hidden: 48, layers: 2, max_epochs: 30, patience: 6, batch_size: 256}
    tune: {noise_scale: [0.1, 0.25]}
  - name: sbtg_feature_bilinear
    params: {hidden: 40, layers: 2, feature_dim: 10, max_epochs: 30, patience: 6, batch_size: 256}
    tune: {noise_scale: [0.1, 0.25], weight_decay: [0.0001, 0.01]}
