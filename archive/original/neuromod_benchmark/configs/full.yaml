schema_version: "1"
name: full
output_dir: outputs/full
history_lags: [1]
horizons: [1, 4, 16]
views: [complete_state, latent, calcium]
seeds: [0, 1, 2, 3, 4]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 64
resource:
  max_threads: 2
  max_parallel_jobs: 1
  max_rss_gb: 6.0
  max_output_gb: 1.5
  nice: 19
  checkpoint_minutes: 20
  stop_free_disk_gb: 4.0
scenarios:
  - {id: "null", family: mechanistic, n_trajectories: 10, params: {n_neurons: 12, n_modulators: 3, n_steps: 1400, burn_in: 2000, mechanism: "null", effect_strength: 0.45, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: additive_mean, family: mechanistic, n_trajectories: 10, params: {n_neurons: 12, n_modulators: 3, n_steps: 1400, burn_in: 2000, mechanism: additive_mean, effect_strength: 0.35, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: synaptic_gain, family: mechanistic, n_trajectories: 10, params: {n_neurons: 12, n_modulators: 3, n_steps: 1400, burn_in: 2000, mechanism: synaptic_gain, effect_strength: 1.2, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: intrinsic_excitability, family: mechanistic, n_trajectories: 10, params: {n_neurons: 12, n_modulators: 3, n_steps: 1400, burn_in: 2000, mechanism: intrinsic_excitability, effect_strength: 0.9, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: stochastic_dispersion, family: mechanistic, n_trajectories: 10, params: {n_neurons: 12, n_modulators: 3, n_steps: 1400, burn_in: 2000, mechanism: innovation_variance, effect_strength: 1.5, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: matched_tail, family: mechanistic, n_trajectories: 10, params: {n_neurons: 12, n_modulators: 3, n_steps: 1400, burn_in: 2000, mechanism: matched_tail, effect_strength: 2.5, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: mixed, family: mechanistic, n_trajectories: 10, params: {n_neurons: 12, n_modulators: 3, n_steps: 1400, burn_in: 2000, mechanism: mixed, effect_strength: 0.8, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
methods:
  - {name: constant_gaussian}
  - {name: ridge_var, tune: {ridge: [0.01, 0.1, 1.0, 10.0, 100.0]}}
  - {name: heteroskedastic_ridge, tune: {mean_ridge: [0.1, 1.0, 10.0], variance_ridge: [1.0, 10.0, 100.0]}}
  - {name: student_t_ridge, params: {mean_ridge: 1.0, variance_ridge: 10.0}, tune: {df: [3.5, 5.0, 10.0, 20.0]}}
  - {name: ridge_full_covariance, tune: {ridge: [0.1, 1.0, 10.0], covariance_shrinkage: [0.05, 0.25]}}
  - {name: conditional_covariance_ridge, horizons: [1], tune: {mean_ridge: [0.1, 1.0], variance_ridge: [1.0, 10.0], correlation_ridge: [1.0, 10.0], correlation_scale: [0.25, 0.45]}}
  - {name: gaussian_nll, params: {maxiter: 350}, tune: {ridge: [0.001, 0.01, 0.1, 1.0]}}
  - {name: sid_hyvarinen, tune: {ridge: [0.01, 0.1, 1.0, 10.0]}}
  - {name: sid_dsm, params: {n_corruptions: 4}, tune: {ridge: [0.01, 0.1, 1.0], sigma_fraction: [0.1, 0.25, 0.5]}}
  - {name: lagged_correlation}
  - {name: conditional_granger_ridge, tune: {ridge: [0.1, 1.0, 10.0]}}
  - {name: lagged_sparse_transition, tune: {alpha: [0.001, 0.01, 0.05, 0.1]}}
  - {name: sindy_discrete, params: {max_iter: 10}, tune: {degree: [1, 2], threshold: [0.005, 0.02, 0.08], ridge: [0.001, 0.03]}}
  - {name: pysindy_discrete_official, horizons: [1], params: {max_iter: 10}, tune: {degree: [1, 2], threshold: [0.005, 0.02, 0.08], alpha: [0.001, 0.03]}}
  - {name: pcmci_parcorr, horizons: [1], params: {tau_max: 1, pc_alpha: 0.2, fdr_method: fdr_bh}}
  - {name: var_lingam_official, horizons: [1], params: {lags: 1, prune: false}}
  - {name: gaussian_mlp_nll, horizons: [1, 4], params: {hidden: 96, layers: 3, max_epochs: 90, patience: 12, batch_size: 256}, tune: {dropout: [0.0, 0.1], weight_decay: [0.0001, 0.001, 0.01]}}
  - {name: gaussian_mlp_dsm, horizons: [1, 4], params: {hidden: 96, layers: 3, max_epochs: 90, patience: 12, batch_size: 256}, tune: {dsm_sigma: [0.1, 0.25, 0.5], weight_decay: [0.0001, 0.01]}}
  - {name: mdn, horizons: [1, 4], params: {hidden: 96, layers: 3, max_epochs: 90, patience: 12, batch_size: 256}, tune: {components: [2, 3, 5], weight_decay: [0.0001, 0.001, 0.01]}}
  - {name: score_mlp_gaussian, horizons: [1, 4], params: {hidden: 96, layers: 3, max_epochs: 70, patience: 10, batch_size: 256}, tune: {noise_scale: [0.1, 0.25, 0.5], weight_decay: [0.0001, 0.01]}}
  - {name: score_mlp_student, horizons: [1, 4], params: {hidden: 96, layers: 3, max_epochs: 70, patience: 10, batch_size: 256}, tune: {kernel_df: [3.5, 7.0], noise_scale: [0.1, 0.25], weight_decay: [0.0001, 0.01]}}
  - {name: score_mlp_student_ladder, horizons: [1], params: {hidden: 96, layers: 3, max_epochs: 70, patience: 10, batch_size: 256, kernel_df: 5.0}, tune: {weight_decay: [0.0001, 0.01]}}
  - {name: sbtg_linear, horizons: [1, 4], params: {hidden: 64, layers: 2, max_epochs: 75, patience: 10, batch_size: 256}, tune: {noise_scale: [0.1, 0.25, 0.5], coupling_l1: [0.0, 0.001]}}
  - {name: sbtg_feature_bilinear, horizons: [1, 4], params: {hidden: 64, layers: 2, feature_dim: 16, max_epochs: 75, patience: 10, batch_size: 256}, tune: {noise_scale: [0.1, 0.25], feature_dim: [8, 16], weight_decay: [0.0001, 0.01]}}
  - {name: sbtg_feature_student, horizons: [1, 4], params: {hidden: 64, layers: 2, feature_dim: 16, max_epochs: 75, patience: 10, batch_size: 256}, tune: {kernel_df: [3.5, 7.0], noise_scale: [0.1, 0.25], weight_decay: [0.0001, 0.01]}}
  - {name: sbtg_feature_student_ladder, horizons: [1], params: {hidden: 64, layers: 2, feature_dim: 16, max_epochs: 75, patience: 10, batch_size: 256, kernel_df: 5.0}, tune: {weight_decay: [0.0001, 0.01]}}
  - {name: conditional_schrodinger_bridge_d015, views: [complete_state], horizons: [4, 16], tune: {mean_ridge: [0.1, 1.0], variance_ridge: [1.0, 10.0]}}
  - {name: conditional_schrodinger_bridge_d030, views: [complete_state], horizons: [4, 16], tune: {mean_ridge: [0.1, 1.0], variance_ridge: [1.0, 10.0]}}
  - {name: conditional_schrodinger_bridge_d060, views: [complete_state], horizons: [4, 16], tune: {mean_ridge: [0.1, 1.0], variance_ridge: [1.0, 10.0]}}
  - {name: latent_neuromodulated_ssm, scenarios: [additive_mean, synaptic_gain, intrinsic_excitability, stochastic_dispersion, mixed], seeds: [0, 1], views: [latent, calcium], horizons: [1], params: {n_modulators: 3, max_epochs: 85, patience: 12, truncation: 128, warmup: 12}, tune: {effect_l1: [0.0001, 0.001], weight_decay: [0.0001, 0.01]}}
  - {name: latent_neuromodulated_mixture_ssm, scenarios: [matched_tail, mixed], seeds: [0, 1], views: [latent, calcium], horizons: [1], params: {n_modulators: 3, max_epochs: 85, patience: 12, truncation: 128, warmup: 12, tail_low_scale: 0.5, tail_high_scale: 3.0}, tune: {effect_l1: [0.0001, 0.001], weight_decay: [0.0001, 0.01]}}
