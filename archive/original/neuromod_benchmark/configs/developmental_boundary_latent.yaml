schema_version: "1"
name: developmental_boundary_latent
output_dir: outputs/developmental_boundary_latent
history_lags: [1]
horizons: [1]
views: [latent, calcium]
# One developmental seed only; never use this seed-selection run for confirmation.
seeds: [2]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 16
resource:
  max_threads: 1
  max_parallel_jobs: 1
  max_rss_gb: 5.0
  max_output_gb: 0.3
  nice: 19
  checkpoint_minutes: 5
  stop_free_disk_gb: 4.0
scenarios:
  - id: mixed
    family: mechanistic
    n_trajectories: 8
    params:
      n_neurons: 8
      n_modulators: 2
      n_steps: 600
      burn_in: 900
      mechanism: mixed
      effect_strength: 0.8
      ligand_pulse_rate_hz: 0.08
      ligand_pulse_amplitude: 2.5
      tail_threshold: 0.35
      shape_tail_z: 2.0
methods:
  # The observed-latent lane expands below the complete-state medium boundary.
  - name: latent_neuromodulated_ssm
    views: [latent]
    params:
      n_modulators: 2
      max_epochs: 45
      patience: 7
      truncation: 80
      warmup: 8
      tail_threshold: 0.35
      shape_tail_z: 2.0
    tune:
      effect_l1: [0.00001, 0.0001, 0.001]
      weight_decay: [0.00001, 0.0001, 0.001]
  # Calcium selected the strongest medium effect penalty, so expand above it.
  - name: latent_neuromodulated_ssm
    views: [calcium]
    params:
      n_modulators: 2
      max_epochs: 45
      patience: 7
      truncation: 80
      warmup: 8
      tail_threshold: 0.35
      shape_tail_z: 2.0
    tune:
      effect_l1: [0.001, 0.01, 0.05]
      weight_decay: [0.00001, 0.0001, 0.001]
