schema_version: "1"
name: tail_mechanistic_medium
output_dir: outputs/tail_mechanistic_medium
history_lags: [1]
horizons: [1]
views: [complete_state, calcium]
seeds: [0, 1, 2]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 128
resource:
  max_threads: 1
  max_parallel_jobs: 1
  max_rss_gb: 5.0
  max_output_gb: 0.4
  nice: 19
  stop_free_disk_gb: 4.0
scenarios:
  - {id: matched_tail, family: mechanistic, n_trajectories: 8, params: {n_neurons: 8, n_modulators: 2, n_steps: 650, burn_in: 900, mechanism: matched_tail, effect_strength: 2.5, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: mixed, family: mechanistic, n_trajectories: 8, params: {n_neurons: 8, n_modulators: 2, n_steps: 650, burn_in: 900, mechanism: mixed, effect_strength: 0.8, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
methods:
  - {name: student_t_ridge, params: {mean_ridge: 1.0, variance_ridge: 10.0}, tune: {df: [3.5, 5.0, 10.0]}}
  - {name: sid_dsm, params: {n_corruptions: 3}, tune: {ridge: [0.01, 0.1, 1.0], sigma_fraction: [0.1, 0.25]}}
  - {name: mdn, params: {hidden: 64, layers: 2, max_epochs: 55, patience: 9, batch_size: 256}, tune: {components: [2, 3, 5], weight_decay: [0.0001, 0.01]}}
  - {name: score_mlp_student, params: {hidden: 64, layers: 2, max_epochs: 45, patience: 8, batch_size: 256}, tune: {kernel_df: [3.5, 7.0], noise_scale: [0.1, 0.25]}}
  - {name: score_mlp_student_ladder, params: {hidden: 64, layers: 2, max_epochs: 45, patience: 8, batch_size: 256, kernel_df: 5.0}, tune: {weight_decay: [0.0001, 0.01]}}
  - {name: sbtg_feature_student, params: {hidden: 48, layers: 2, feature_dim: 12, max_epochs: 50, patience: 8, batch_size: 256}, tune: {kernel_df: [3.5, 7.0], noise_scale: [0.1, 0.25]}}
  - {name: sbtg_feature_student_ladder, params: {hidden: 48, layers: 2, feature_dim: 12, max_epochs: 50, patience: 8, batch_size: 256, kernel_df: 5.0}, tune: {weight_decay: [0.0001, 0.01]}}
  - {name: latent_neuromodulated_ssm, params: {n_modulators: 2, max_epochs: 80, patience: 12, truncation: 96, warmup: 8}, tune: {effect_l1: [0.0001, 0.001], weight_decay: [0.0001, 0.01]}}
  - {name: latent_neuromodulated_mixture_ssm, params: {n_modulators: 2, max_epochs: 80, patience: 12, truncation: 96, warmup: 8, tail_low_scale: 0.5, tail_high_scale: 3.0}, tune: {effect_l1: [0.0001, 0.001], weight_decay: [0.0001, 0.01]}}
