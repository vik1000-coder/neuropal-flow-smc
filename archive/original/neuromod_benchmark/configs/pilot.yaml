schema_version: "1"
name: pilot_v2
output_dir: outputs/pilot_v2
history_lags: [1]
horizons: [1]
views: [complete_state, latent, calcium]
seeds: [0]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 8
resource:
  max_threads: 1
  max_parallel_jobs: 1
  max_rss_gb: 5.0
  max_output_gb: 0.3
  nice: 19
  checkpoint_minutes: 5
  stop_free_disk_gb: 4.0
scenarios:
  - &base
    id: "null"
    family: mechanistic
    n_trajectories: 5
    params: {n_neurons: 4, n_modulators: 1, n_steps: 180, burn_in: 300, mechanism: "null", effect_strength: 0.45, ligand_pulse_rate_hz: 0.12, ligand_pulse_amplitude: 2.5}
  - <<: *base
    id: additive_mean
    params: {n_neurons: 4, n_modulators: 1, n_steps: 180, burn_in: 300, mechanism: additive_mean, effect_strength: 0.35, ligand_pulse_rate_hz: 0.12, ligand_pulse_amplitude: 2.5}
  - <<: *base
    id: synaptic_gain
    params: {n_neurons: 4, n_modulators: 1, n_steps: 180, burn_in: 300, mechanism: synaptic_gain, effect_strength: 1.2, ligand_pulse_rate_hz: 0.12, ligand_pulse_amplitude: 2.5}
  - <<: *base
    id: intrinsic_excitability
    params: {n_neurons: 4, n_modulators: 1, n_steps: 180, burn_in: 300, mechanism: intrinsic_excitability, effect_strength: 0.9, ligand_pulse_rate_hz: 0.12, ligand_pulse_amplitude: 2.5}
  - <<: *base
    id: stochastic_dispersion
    params: {n_neurons: 4, n_modulators: 1, n_steps: 180, burn_in: 300, mechanism: innovation_variance, effect_strength: 1.5, ligand_pulse_rate_hz: 0.12, ligand_pulse_amplitude: 2.5}
  - <<: *base
    id: matched_tail
    params: {n_neurons: 4, n_modulators: 1, n_steps: 180, burn_in: 300, mechanism: matched_tail, effect_strength: 2.5, ligand_pulse_rate_hz: 0.12, ligand_pulse_amplitude: 2.5}
  - <<: *base
    id: mixed
    params: {n_neurons: 4, n_modulators: 1, n_steps: 180, burn_in: 300, mechanism: mixed, effect_strength: 0.8, ligand_pulse_rate_hz: 0.12, ligand_pulse_amplitude: 2.5}
methods:
  - {name: constant_gaussian}
  - name: ridge_var
    tune: {ridge: [0.1, 1.0, 10.0]}
  - name: heteroskedastic_ridge
    tune: {mean_ridge: [0.1, 1.0], variance_ridge: [1.0, 10.0]}
  - name: student_t_ridge
    params: {mean_ridge: 1.0, variance_ridge: 10.0}
    tune: {df: [3.5, 5.0, 10.0]}
  - name: gaussian_nll
    params: {maxiter: 120}
    tune: {ridge: [0.001, 0.1]}
  - name: sid_hyvarinen
    tune: {ridge: [0.01, 0.1, 1.0]}
  - name: sid_dsm
    params: {n_corruptions: 2}
    tune: {ridge: [0.01, 0.1], sigma_fraction: [0.1, 0.25]}
  - {name: lagged_correlation}
  - name: conditional_granger_ridge
    tune: {ridge: [0.1, 1.0]}
  - name: lagged_sparse_transition
    tune: {alpha: [0.001, 0.02]}
  - name: sindy_discrete
    params: {ridge: 0.01, max_iter: 6}
    tune: {degree: [1, 2], threshold: [0.005, 0.03]}
  - name: gaussian_mlp_nll
    params: {hidden: 24, layers: 2, max_epochs: 12, patience: 4, batch_size: 128}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: gaussian_mlp_dsm
    params: {hidden: 24, layers: 2, max_epochs: 12, patience: 4, batch_size: 128}
    tune: {dsm_sigma: [0.1, 0.25]}
  - name: mdn
    params: {hidden: 24, layers: 2, max_epochs: 12, patience: 4, batch_size: 128}
    tune: {components: [2, 3]}
  - name: score_mlp_gaussian
    params: {hidden: 24, layers: 2, max_epochs: 10, patience: 3, batch_size: 128}
    tune: {noise_scale: [0.1, 0.25]}
  - name: score_mlp_student
    params: {hidden: 24, layers: 2, max_epochs: 10, patience: 3, batch_size: 128}
    tune: {kernel_df: [3.5, 7.0]}
  - name: sbtg_linear
    params: {hidden: 20, layers: 1, max_epochs: 10, patience: 3, batch_size: 128}
    tune: {noise_scale: [0.1, 0.25]}
  - name: sbtg_feature_bilinear
    params: {hidden: 20, layers: 1, feature_dim: 6, max_epochs: 10, patience: 3, batch_size: 128}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: sbtg_feature_student
    params: {hidden: 20, layers: 1, feature_dim: 6, max_epochs: 10, patience: 3, batch_size: 128}
    tune: {kernel_df: [3.5, 7.0]}
  - name: conditional_schrodinger_bridge
    views: [complete_state, latent]
    tune: {reference_diffusion: [0.15, 0.35]}
  - name: latent_neuromodulated_ssm
    horizons: [1]
    params: {n_modulators: 1, max_epochs: 16, patience: 4, truncation: 64, warmup: 4}
    tune: {effect_l1: [0.0001, 0.005]}
