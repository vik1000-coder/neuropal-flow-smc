schema_version: "1"
name: objective_adjudication_20260712
output_dir: outputs/objective_adjudication_20260712
history_lags: [1]
horizons: [1]
views: [complete_state]
seeds: [8, 9, 10, 11, 12]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 64
resource:
  max_threads: 2
  max_parallel_jobs: 1
  max_rss_gb: 6.0
  max_output_gb: 1.0
  nice: 19
  checkpoint_minutes: 20
  stop_free_disk_gb: 4.0
scenarios:
  - id: "null"
    family: mechanistic
    n_trajectories: 10
    params: &base
      n_neurons: 10
      n_modulators: 3
      n_steps: 1000
      burn_in: 1500
      mechanism: "null"
      effect_strength: 0.45
      ligand_pulse_rate_hz: 0.08
      ligand_pulse_amplitude: 2.5
      tail_threshold: 0.35
      shape_tail_z: 2.0
  - id: additive_mean
    family: mechanistic
    n_trajectories: 10
    params: {<<: *base, mechanism: additive_mean, effect_strength: 0.35}
  - id: synaptic_gain
    family: mechanistic
    n_trajectories: 10
    params: {<<: *base, mechanism: synaptic_gain, effect_strength: 1.2}
  - id: stochastic_dispersion
    family: mechanistic
    n_trajectories: 10
    params: {<<: *base, mechanism: innovation_variance, effect_strength: 1.5}
  - id: matched_tail
    family: mechanistic
    n_trajectories: 10
    params: {<<: *base, mechanism: matched_tail, effect_strength: 2.5}
methods:
  - name: ridge_var
    tune: {ridge: [0.1, 1.0, 10.0]}
  - name: student_t_ridge
    params: {mean_ridge: 1.0, variance_ridge: 10.0}
    tune: {df: [3.5, 10.0]}
  - name: gaussian_nll
    params: {maxiter: 300, ridge: 0.1}
  - name: sid_hyvarinen
    params: {ridge: 0.01, tail_threshold: 0.35}
  - name: sid_dsm_s075
    params: {ridge: 0.01, n_corruptions: 4, tail_threshold: 0.35}
  - name: sid_dsm_s100
    params: {ridge: 0.01, n_corruptions: 4, tail_threshold: 0.35}
  - name: gaussian_mlp_nll
    params: {hidden: 64, layers: 2, max_epochs: 60, patience: 9, batch_size: 256, tail_threshold: 0.35}
    tune: {dropout: [0.0, 0.1], weight_decay: [0.0001, 0.01]}
  - name: gaussian_mlp_dsm_s025
    params: {hidden: 64, layers: 2, max_epochs: 60, patience: 9, batch_size: 256, tail_threshold: 0.35}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: gaussian_mlp_dsm_s050
    params: {hidden: 64, layers: 2, max_epochs: 60, patience: 9, batch_size: 256, tail_threshold: 0.35}
    tune: {weight_decay: [0.0001, 0.01]}
  - name: mdn_k3
    params: {hidden: 64, layers: 2, max_epochs: 60, patience: 9, batch_size: 256, tail_threshold: 0.35, shape_tail_z: 2.0}
    tune: {weight_decay: [0.0001, 0.01]}
