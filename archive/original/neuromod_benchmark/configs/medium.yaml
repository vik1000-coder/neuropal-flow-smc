schema_version: "1"
name: medium
output_dir: outputs/medium
history_lags: [1]
horizons: [1, 4]
views: [complete_state, calcium]
seeds: [0, 1, 2]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 16
resource:
  max_threads: 2
  max_parallel_jobs: 1
  max_rss_gb: 6.0
  max_output_gb: 0.8
  nice: 19
  checkpoint_minutes: 10
  stop_free_disk_gb: 4.0
scenarios:
  - {id: "null", family: mechanistic, n_trajectories: 8, params: {n_neurons: 8, n_modulators: 2, n_steps: 600, burn_in: 900, mechanism: "null", effect_strength: 0.45, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: additive_mean, family: mechanistic, n_trajectories: 8, params: {n_neurons: 8, n_modulators: 2, n_steps: 600, burn_in: 900, mechanism: additive_mean, effect_strength: 0.35, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: synaptic_gain, family: mechanistic, n_trajectories: 8, params: {n_neurons: 8, n_modulators: 2, n_steps: 600, burn_in: 900, mechanism: synaptic_gain, effect_strength: 1.2, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: intrinsic_excitability, family: mechanistic, n_trajectories: 8, params: {n_neurons: 8, n_modulators: 2, n_steps: 600, burn_in: 900, mechanism: intrinsic_excitability, effect_strength: 0.9, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: stochastic_dispersion, family: mechanistic, n_trajectories: 8, params: {n_neurons: 8, n_modulators: 2, n_steps: 600, burn_in: 900, mechanism: innovation_variance, effect_strength: 1.5, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: matched_tail, family: mechanistic, n_trajectories: 8, params: {n_neurons: 8, n_modulators: 2, n_steps: 600, burn_in: 900, mechanism: matched_tail, effect_strength: 2.5, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
  - {id: mixed, family: mechanistic, n_trajectories: 8, params: {n_neurons: 8, n_modulators: 2, n_steps: 600, burn_in: 900, mechanism: mixed, effect_strength: 0.8, ligand_pulse_rate_hz: 0.08, ligand_pulse_amplitude: 2.5}}
methods:
  - {name: constant_gaussian}
  - {name: ridge_var, tune: {ridge: [0.01, 0.1, 1.0, 10.0]}}
  - {name: heteroskedastic_ridge, tune: {mean_ridge: [0.1, 1.0], variance_ridge: [1.0, 10.0, 100.0]}}
  - {name: student_t_ridge, params: {mean_ridge: 1.0, variance_ridge: 10.0}, tune: {df: [3.5, 5.0, 10.0]}}
  - {name: gaussian_nll, params: {maxiter: 250}, tune: {ridge: [0.001, 0.01, 0.1]}}
  - {name: sid_hyvarinen, tune: {ridge: [0.01, 0.1, 1.0]}}
  - {name: sid_dsm, params: {n_corruptions: 3}, tune: {ridge: [0.01, 0.1, 1.0], sigma_fraction: [0.1, 0.25, 0.5]}}
  - {name: lagged_correlation}
  - {name: conditional_granger_ridge, tune: {ridge: [0.1, 1.0, 10.0]}}
  - {name: lagged_sparse_transition, tune: {alpha: [0.001, 0.01, 0.05]}}
  - {name: sindy_discrete, params: {max_iter: 8}, tune: {degree: [1, 2], threshold: [0.005, 0.02, 0.08], ridge: [0.001, 0.03]}}
  - {name: pysindy_discrete_official, horizons: [1], params: {max_iter: 8}, tune: {degree: [1, 2], threshold: [0.01, 0.05], alpha: [0.001, 0.03]}}
  - {name: pcmci_parcorr, horizons: [1], params: {tau_max: 1, pc_alpha: 0.2, fdr_method: fdr_bh}}
  - {name: var_lingam_official, horizons: [1], params: {lags: 1, prune: false}}
  - {name: gaussian_mlp_nll, params: {hidden: 64, layers: 2, max_epochs: 45, patience: 8, batch_size: 256}, tune: {dropout: [0.0, 0.1], weight_decay: [0.0001, 0.01]}}
  - {name: gaussian_mlp_dsm, params: {hidden: 64, layers: 2, max_epochs: 45, patience: 8, batch_size: 256}, tune: {dsm_sigma: [0.1, 0.25], weight_decay: [0.0001, 0.01]}}
  - {name: mdn, params: {hidden: 64, layers: 2, max_epochs: 45, patience: 8, batch_size: 256}, tune: {components: [2, 3, 5], weight_decay: [0.0001, 0.01]}}
  - {name: score_mlp_gaussian, params: {hidden: 64, layers: 2, max_epochs: 35, patience: 7, batch_size: 256}, tune: {noise_scale: [0.1, 0.25]}}
  - {name: score_mlp_student, params: {hidden: 64, layers: 2, max_epochs: 35, patience: 7, batch_size: 256}, tune: {kernel_df: [3.5, 7.0], noise_scale: [0.1, 0.25]}}
  - {name: sbtg_linear, params: {hidden: 48, layers: 2, max_epochs: 40, patience: 7, batch_size: 256}, tune: {noise_scale: [0.1, 0.25], coupling_l1: [0.0, 0.001]}}
  - {name: sbtg_feature_bilinear, params: {hidden: 48, layers: 2, feature_dim: 12, max_epochs: 40, patience: 7, batch_size: 256}, tune: {noise_scale: [0.1, 0.25], weight_decay: [0.0001, 0.01]}}
  - {name: sbtg_feature_student, params: {hidden: 48, layers: 2, feature_dim: 12, max_epochs: 40, patience: 7, batch_size: 256}, tune: {kernel_df: [3.5, 7.0], weight_decay: [0.0001, 0.01]}}
  - {name: conditional_schrodinger_bridge, views: [complete_state], tune: {reference_diffusion: [0.15, 0.3, 0.6], variance_ridge: [1.0, 10.0]}}
  - {name: latent_neuromodulated_ssm, horizons: [1], params: {n_modulators: 2, max_epochs: 60, patience: 10, truncation: 96, warmup: 8}, tune: {effect_l1: [0.0001, 0.001, 0.01], weight_decay: [0.0001, 0.01]}}
