schema_version: "1"
name: causal_stress_developmental_v2
output_dir: outputs/causal_stress_developmental_v2
history_lags: [1]
horizons: [1]
views: [complete_state]
seeds: [0, 1, 2]
validation_fraction: 0.2
test_fraction: 0.2
n_predictive_samples: 4
resource:
  max_threads: 2
  max_parallel_jobs: 1
  max_rss_gb: 4.0
  max_output_gb: 0.2
  nice: 19
  checkpoint_minutes: 5
  stop_free_disk_gb: 4.0
scenarios:
  - id: causally_sufficient
    family: legacy_generalized
    n_trajectories: 8
    params:
      n_neurons: 8
      n_modulators: 2
      n_steps: 700
      burn_in: 200
      mechanism: "null"
      hidden_driver_strength: 0.0
      include_counterfactual: false
      store_pointwise_jacobians: true
  - id: persistent_hidden_common_driver
    family: legacy_generalized
    n_trajectories: 8
    params:
      n_neurons: 8
      n_modulators: 2
      n_steps: 700
      burn_in: 200
      mechanism: "null"
      hidden_driver_strength: 0.55
      include_counterfactual: false
      store_pointwise_jacobians: true
methods:
  - {name: lagged_correlation}
  - name: ridge_var
    tune: {ridge: [0.1, 1.0, 10.0]}
  - name: conditional_granger_ridge
    tune: {ridge: [0.1, 1.0, 10.0]}
  - name: lagged_sparse_transition
    tune: {alpha: [0.001, 0.01, 0.05]}
  - name: pcmci_parcorr
    params: {tau_max: 1, pc_alpha: 0.2, alpha_level: 0.05, fdr_method: fdr_bh}
  - name: var_lingam_official
    params: {lags: 1, prune: false}
