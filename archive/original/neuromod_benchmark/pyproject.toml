[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromod-benchmark"
version = "0.1.0"
description = "Mechanism-first recovery benchmark for stochastic neuromodulated dynamics"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "torch>=2.0",
]

[project.scripts]
neuromod-benchmark = "neuromod_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: resource-capped integration tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
