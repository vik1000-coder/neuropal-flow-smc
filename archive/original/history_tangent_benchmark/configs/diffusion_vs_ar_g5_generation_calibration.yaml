schema_version: "1"
name: diffusion_vs_ar_g5_generation_calibration
tier: development
output_dir: results/diffusion_vs_ar_g5_generation_calibration_20260713

# Disjoint development seed; generator selection is frozen before replication.
generator_seeds: [41]
data_seeds: [301]
model_seeds: [1301]

generators:
  - id: g5
    kind: g5
    params: {q: 8, dy: 64, latent_dim: 4, n_components: 8, rank: 2,
             sigma_z: 0.5, sigma_obs: 0.1, mode_separation: 4.0}

models:
  - name: ar_t_o0
    kind: autoregressive_transformer
    parameter_budget: focused_50k
    params: {d_model: 48, nhead: 4, transformer_layers: 2,
             feedforward: 128, components: 8, dropout: 0.0,
             permutation_seed: 0}
    tune: {learning_rate: [0.001]}
  - name: ar_t_o17
    kind: autoregressive_transformer
    parameter_budget: focused_50k
    params: {d_model: 48, nhead: 4, transformer_layers: 2,
             feedforward: 128, components: 8, dropout: 0.0,
             permutation_seed: 17}
    tune: {learning_rate: [0.001]}
  - name: ar_t_o29
    kind: autoregressive_transformer
    parameter_budget: focused_50k
    params: {d_model: 48, nhead: 4, transformer_layers: 2,
             feedforward: 128, components: 8, dropout: 0.0,
             permutation_seed: 29}
    tune: {learning_rate: [0.001]}
  - name: diffusion_legacy
    kind: conditional_vector_diffusion
    parameter_budget: focused_50k
    params: {hidden: 120, layers: 3, sigma_min: 0.01, sigma_max: 2.0}
    tune: {learning_rate: [0.001]}
  - name: diffusion_edm
    kind: conditional_edm_diffusion
    parameter_budget: focused_50k
    params: {hidden: 120, layers: 3, sigma_min: 0.01, sigma_max: 2.5,
             sigma_data: 0.8, p_mean: -0.8, p_std: 1.2,
             sample_steps: 24}
    tune: {learning_rate: [0.0003]}

split:
  validation_fraction: 0.2
  validation_min: 1000
  validation_max: 1000
  test_size: 512
  evaluation_histories: 8
  conditional_oracle_draws: 32

training:
  n_train: 5000
  device: cpu
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 256
  max_epochs: 60
  patience: 15
  gradient_clip: 1.0

evaluation:
  energy_cases: 64
  energy_samples: 64
  # Tangent reconstruction is diagnostic only in this high-dimensional lane.
  tangent_pairs: 4
  centering_histories: 2
  centering_draws: 8
  centering_target_draws: 2
  finite_delta: 0.1
  diffusion_sigma: 0.05
  quadrature_points: 2

resource:
  max_threads: 1
  max_parallel_jobs: 1
  max_rss_gb: 10.0
  max_accelerator_gb: 0.1
  max_output_gb: 2.0
  min_free_disk_gb: 4.0
  case_timeout_minutes: 90.0
  checkpoint_minutes: 10.0
  nice: 10

metadata:
  purpose: development-only generator selection for the difficult-geometry endpoint
  primary_metric: energy_score_fair
  claim: no confirmatory decision
  audit: DIFFUSION_VS_AUTOREGRESSION_AUDIT.md
