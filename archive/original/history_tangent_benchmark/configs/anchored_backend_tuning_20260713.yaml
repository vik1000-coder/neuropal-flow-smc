schema_version: "1"
name: anchored_backend_tuning_20260713
tier: development
output_dir: results/anchored_backend_tuning_20260713
generator_seeds: [53]
data_seeds: [503]
model_seeds: [5003]

generators:
  - id: g1_gaussian
    kind: g1
    params: {q: 8, dy: 8, hidden: 16}
  - id: g4_multimodal
    kind: g4
    params: {q: 8, dy: 8, n_components: 6, rank: 2, mode_separation: 5.0,
             component_sigma: 0.65, interaction_scale: 1.0}
  - id: g8_shape_path
    kind: g8
    params: {q: 13, dy: 24, n_channels: 3, motif_rank: 3,
             motif_scale: 0.45, noise_sd: 0.08,
             correlated_noise_scale: 0.06, shape_sensitivity: 1.2}

models:
  - {name: gaussian, kind: heteroscedastic_gaussian, params: {hidden: 64, layers: 2}, tune: {learning_rate: [0.001]}}
  - {name: mdn, kind: autoregressive_mdn, params: {hidden: 48, layers: 2, components: 8}, tune: {learning_rate: [0.001]}}
  - {name: fm_standard, kind: conditional_flow_matching, params: {hidden: 64, layers: 2, sample_steps: 18}, tune: {learning_rate: [0.001]}}
  - {name: energy_b05, kind: bounded_energy_ratio, params: {hidden: 64, layers: 2, tilt_bound: 0.5, base_nll_weight: 0.25, oversample: 6, centering_samples: 32}, tune: {learning_rate: [0.001]}}
  - {name: energy_b10, kind: bounded_energy_ratio, params: {hidden: 64, layers: 2, tilt_bound: 1.0, base_nll_weight: 0.25, oversample: 6, centering_samples: 32}, tune: {learning_rate: [0.001]}}
  - {name: energy_b20, kind: bounded_energy_ratio, params: {hidden: 64, layers: 2, tilt_bound: 2.0, base_nll_weight: 0.25, oversample: 6, centering_samples: 32}, tune: {learning_rate: [0.001]}}
  - {name: gaussian_source_fm_w025, kind: gaussian_source_flow_matching, params: {hidden: 64, layers: 2, sample_steps: 18, base_nll_weight: 0.25}, tune: {learning_rate: [0.001]}}
  - {name: gaussian_source_fm_w100, kind: gaussian_source_flow_matching, params: {hidden: 64, layers: 2, sample_steps: 18, base_nll_weight: 1.0}, tune: {learning_rate: [0.001]}}
  - {name: edm_sd05, kind: conditional_edm_diffusion, params: {hidden: 64, layers: 2, sigma_min: 0.01, sigma_max: 4.0, sigma_data: 0.5, sample_steps: 18, rho: 7.0}, tune: {learning_rate: [0.001]}}
  - {name: edm_sd10, kind: conditional_edm_diffusion, params: {hidden: 64, layers: 2, sigma_min: 0.01, sigma_max: 4.0, sigma_data: 1.0, sample_steps: 18, rho: 7.0}, tune: {learning_rate: [0.001]}}
  - {name: anchored_edm_w010, kind: gaussian_anchored_edm, params: {hidden: 64, layers: 2, sigma_min: 0.01, sigma_max: 4.0, sample_steps: 18, rho: 7.0, base_nll_weight: 0.1}, tune: {learning_rate: [0.001]}}
  - {name: anchored_edm_w050, kind: gaussian_anchored_edm, params: {hidden: 64, layers: 2, sigma_min: 0.01, sigma_max: 4.0, sample_steps: 18, rho: 7.0, base_nll_weight: 0.5}, tune: {learning_rate: [0.001]}}

split: {validation_fraction: 0.2, validation_min: 800, validation_max: 800,
        test_size: 256, evaluation_histories: 8, conditional_oracle_draws: 32}
training: {n_train: 4000, device: cpu, learning_rate: 0.001,
           weight_decay: 0.0001, batch_size: 256, max_epochs: 40,
           patience: 8, gradient_clip: 1.0}
evaluation: {energy_cases: 64, energy_samples: 32, tangent_pairs: 32,
             centering_histories: 4, centering_draws: 16,
             centering_target_draws: 6, finite_delta: 0.12,
             diffusion_sigma: 0.12, quadrature_points: 4}
resource: {max_threads: 1, max_parallel_jobs: 1, max_rss_gb: 7.0,
           max_accelerator_gb: 0.1, max_output_gb: 0.75,
           min_free_disk_gb: 4.0, case_timeout_minutes: 60.0,
           checkpoint_minutes: 10.0, nice: 12}
metadata:
  purpose: validation screen of tail-safe energy, baseline-source flow, and Gaussian-anchored EDM stabilizers
  selection_rule: native validation within fixed objective; held-out fair energy score when objective weights differ
  claim: developmental; no hypothesis decision
