schema_version: "1"
name: homefield_stabilization_smoke
tier: development
output_dir: results/homefield_stabilization_smoke_20260713

generator_seeds: [31]
data_seeds: [211]
model_seeds: [1201]

generators:
  - id: g4_multimodal
    kind: g4
    params: {q: 6, dy: 4, n_components: 4, rank: 2, mode_separation: 5.0,
             component_sigma: 0.7, interaction_scale: 1.0}

models:
  - name: mean
    kind: mean_mlp
    params: {hidden: 24, layers: 1}
  - name: gaussian_nll
    kind: heteroscedastic_gaussian
    params: {hidden: 24, layers: 1}
  - name: gaussian_dsm_constrained
    kind: constrained_gaussian_dsm
    params: {hidden: 24, layers: 1, sigma_min: 0.03, sigma_max: 1.0}
  - name: mdn
    kind: autoregressive_mdn
    params: {hidden: 16, layers: 1, components: 4}
  - name: affine_flow
    kind: conditional_affine_flow
    params: {hidden: 20, layers: 1, coupling_layers: 4}
  - name: diffusion_legacy
    kind: conditional_vector_diffusion
    params: {hidden: 24, layers: 1, sigma_min: 0.02, sigma_max: 2.0}
  - name: diffusion_edm
    kind: conditional_edm_diffusion
    params: {hidden: 24, layers: 1, sigma_min: 0.02, sigma_max: 2.5,
             sigma_data: 0.8, sample_steps: 6}
  - name: flow_matching
    kind: conditional_flow_matching
    params: {hidden: 24, layers: 1, sample_steps: 6}
  - name: ratio_critic
    kind: ratio_critic
    params: {hidden: 20, layers: 1, rank: 12}

split:
  validation_fraction: 0.2
  validation_min: 128
  validation_max: 128
  test_size: 96
  evaluation_histories: 4
  conditional_oracle_draws: 16

training:
  n_train: 512
  device: cpu
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 128
  max_epochs: 2
  patience: 2
  gradient_clip: 1.0

evaluation:
  energy_cases: 12
  energy_samples: 8
  tangent_pairs: 12
  centering_histories: 2
  centering_draws: 8
  centering_target_draws: 4
  finite_delta: 0.15
  diffusion_sigma: 0.15
  quadrature_points: 3

resource:
  max_threads: 1
  max_parallel_jobs: 1
  max_rss_gb: 5.0
  max_accelerator_gb: 0.1
  max_output_gb: 0.25
  min_free_disk_gb: 4.0
  case_timeout_minutes: 15.0
  checkpoint_minutes: 5.0
  nice: 10

metadata:
  purpose: correctness and resource smoke for stable score/flow home-field suite
  claim: no scientific ranking
