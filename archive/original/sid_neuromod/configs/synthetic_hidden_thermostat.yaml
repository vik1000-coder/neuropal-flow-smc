experiment:
  kind: hidden_thermostat
  T: 200000
  a: 0.9
  b: 0.4
  n_lags: 12

random_seed: 0

model:
  class: quadratic_score
  ridge: 1.0e-6
  sigma_grid: [0.0, 0.25, 0.5, 1.0]

inference:
  alpha: 0.05
  n_mc_sup_t: 5000

outputs:
  output_dir: output/synthetic/hidden_thermostat
  save_figures: true
