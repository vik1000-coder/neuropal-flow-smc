experiment:
  kind: change_detection
  T: 60000          # long stream: memory-only changes need long runs (Table 2)
  t_change: 6000
  n_lags: 6
  n_replications: 20
  scenarios: [null, scale, memory]

random_seed: 0

monitoring:
  alpha: 0.01
  delta: 0.01
  channels: [dispersion, serial]
  lambda_grid: [-1.0, -0.5, -0.25, -0.125, 0.125, 0.25, 0.5, 1.0]

outputs:
  output_dir: output/synthetic/change_detection
